<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeCraft — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!-- Tech logos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
  <style>
    /* ========== Design tokens ========== */
    :root {
      --bg: #080816;
      --bg-2: #0c0c1e;
      --surface: #11112a;
      --surface-2: #161634;
      --border: #24244a;
      --text: #f4f4ff;
      --muted: #a3a3c2;
      --dim: #6d6d8f;
      --primary: #6c5ce7;
      --primary-2: #8b7bff;
      --grad: linear-gradient(135deg, #7c6cff 0%, #5b4fe0 100%);
      --radius: 12px;
      --max: 1180px;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    .container { width: min(var(--max), 92%); margin-inline: auto; }
    section { padding: 88px 0; }
    .alt { background: var(--bg-2); border-block: 1px solid #14142c; }

    /* ========== Shared atoms ========== */
    .pill {
      display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; color: var(--primary-2);
      background: rgba(124,108,255,.12); border: 1px solid rgba(124,108,255,.25);
      padding: 5px 10px; border-radius: 6px;
    }
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--primary-2); }
    .section-head { text-align: center; margin-bottom: 48px; }
    .section-head h2 { font-size: clamp(26px, 3vw, 34px); margin-top: 8px; }
    .section-head p { color: var(--muted); max-width: 560px; margin: 10px auto 0; }
    .grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .btn {
      display: inline-flex; align-items: center; gap: 10px; font: 500 14px "Inter";
      padding: 12px 22px; border-radius: 8px; cursor: pointer; border: 1px solid transparent;
      transition: transform .2s, box-shadow .2s, background .2s, border-color .2s;
    }
    .btn svg { width: 16px; height: 16px; }
    .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 8px 24px -8px rgba(108,92,231,.7); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -8px rgba(108,92,231,.9); }
    .btn-outline { background: transparent; color: var(--text); border-color: #4a4a72; }
    .btn-outline:hover { border-color: var(--primary-2); background: rgba(124,108,255,.08); }
    .btn-sm { padding: 9px 16px; font-size: 13px; }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      transition: transform .25s, border-color .25s, box-shadow .25s;
    }
    .card:hover { border-color: #3a3a6e; }

    /* ========== Navbar ========== */
    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(8,8,22,.78); backdrop-filter: blur(14px);
      border-bottom: 1px solid #16162f;
    }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 72px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
    .logo span { color: var(--primary-2); font-family: var(--mono); font-size: 18px; }
    .nav-links { display: flex; gap: 34px; list-style: none; }
    .nav-links a { font-size: 14px; color: var(--muted); position: relative; padding: 6px 0; transition: color .2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .nav-links a.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 2px;
      background: var(--grad); border-radius: 2px;
    }
    .menu-btn { display: none; background: none; border: 0; color: var(--text); cursor: pointer; }
    .menu-btn svg { width: 26px; height: 26px; }

    /* ========== Page switching ========== */
    .page { display: none; animation: fade .45s ease; }
    .page.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* ========== Hero ========== */
    .hero { padding: 72px 0 40px; position: relative; overflow: hidden; }
    .hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 40px; align-items: center; }
    .hero h1 { font-size: clamp(40px, 5.4vw, 60px); line-height: 1.1; margin: 18px 0 8px; font-weight: 700; }
    .hero h1 .name { color: var(--primary-2); }
    .hero h2 { font-size: clamp(26px, 3.2vw, 38px); font-weight: 600; line-height: 1.2; }
    .hero p.lead { color: var(--muted); max-width: 470px; margin: 18px 0 30px; }
    .hero-actions { display: flex; gap: 16px; flex-wrap: wrap; }
    .tech-label { margin-top: 48px; font-size: 12px; font-weight: 600; letter-spacing: .12em; color: var(--muted); }
    .tech-row { display: flex; gap: 22px; margin-top: 16px; flex-wrap: wrap; }
    .tech-row i { font-size: 30px; transition: transform .2s; }
    .tech-row i:hover { transform: translateY(-4px) scale(1.1); }

    .hero-visual { position: relative; height: 460px; }
    .orb {
      position: absolute; right: 40px; top: 10px; width: 380px; height: 380px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #9a8cff 0%, #6c5ce7 45%, #3d2fb3 100%);
      box-shadow: 0 0 120px -10px rgba(108,92,231,.6);
    }
    .avatar {
      position: absolute; right: 120px; top: 50px; width: 290px; height: 350px;
      display: grid; place-items: end center;
    }
    .avatar svg { width: 100%; height: 100%; }
    .dots {
      position: absolute; right: 0; top: 10px; width: 90px; height: 70px;
      background-image: radial-gradient(#5c5c8a 1.3px, transparent 1.3px); background-size: 12px 12px;
    }
    .squiggle { position: absolute; left: 0; bottom: 60px; width: 80px; color: #c9c9e8; }
    .hero-photo {
      position: absolute; right: 70px; top: 40px; width: 320px; height: 320px; border-radius: 50%;
      object-fit: cover; object-position: 50% 30%; border: 6px solid rgba(255,255,255,.08);
      box-shadow: 0 0 0 2px rgba(155,140,255,.5), 0 30px 60px -20px rgba(0,0,0,.8);
    }
    .portrait img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
    .quote .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: 50% 30%; }
    .code-card {
      position: absolute; right: -10px; top: 250px; width: 250px;
      background: rgba(14,14,34,.92); border: 1px solid var(--border); border-radius: 10px;
      font-family: var(--mono); font-size: 11.5px; box-shadow: 0 20px 50px -15px rgba(0,0,0,.8);
      animation: float 5s ease-in-out infinite;
    }
    .code-card .bar { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--border); color: var(--muted); }
    .code-card .bar i { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; box-shadow: 0 0 8px #2ecc71; }
    .code-card pre { padding: 12px 14px; line-height: 1.75; white-space: pre-wrap; }
    .k { color: #c792ea; } .p { color: #82aaff; } .s { color: #f78c6c; } .c { color: var(--muted); }
    @keyframes float { 50% { transform: translateY(-10px); } }

    /* ========== About + stats ========== */
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
    .about-grid h2 { font-size: clamp(24px, 2.8vw, 32px); line-height: 1.3; margin: 16px 0 14px; font-weight: 600; }
    .about-grid p { color: var(--muted); margin-bottom: 24px; max-width: 470px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; }
    .stat { display: flex; gap: 16px; align-items: center; padding: 28px 24px; }
    .stat:nth-child(odd) { border-right: 1px solid var(--border); }
    .stat:nth-child(-n+2) { border-bottom: 1px solid var(--border); }
    .stat .ico {
      width: 46px; height: 46px; flex: none; border-radius: 10px; display: grid; place-items: center;
      background: rgba(124,108,255,.18); border: 1px solid rgba(124,108,255,.35); color: #cfc8ff;
    }
    .stat .ico svg { width: 22px; height: 22px; }
    .stat b { font-size: 30px; font-weight: 600; display: block; line-height: 1.1; }
    .stat span { font-size: 13px; color: var(--muted); }

    /* ========== Skills ========== */
    .skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px 56px; }
    .skill-top { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; }
    .skill-top i { font-size: 20px; width: 22px; }
    .skill-top .devicon-nextjs-plain { color: #fff; }
    .skill-top em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 13px; }
    .track { margin: 10px 0 0 34px; height: 6px; border-radius: 6px; background: #1d1d3c; overflow: hidden; }
    .track span { display: block; height: 100%; width: 0; background: var(--grad); border-radius: 6px; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }

    /* ========== Projects ========== */
    .projects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .project { overflow: hidden; display: flex; flex-direction: column; }
    .project:hover { transform: translateY(-6px); box-shadow: 0 24px 50px -20px rgba(108,92,231,.45); }
    .thumb { position: relative; height: 180px; overflow: hidden; border-bottom: 1px solid var(--border); }
    .thumb .num { position: absolute; top: 12px; left: 14px; font-size: 12px; font-weight: 600; z-index: 2; color: #fff; }
    .t-purple { color: #b77bff; } .t-light { color: #4f6bff; } .t-dark { color: #2ee6a6; } .t-teal { color: #4fe3d1; } .t-orange { color: #ff9a3c; } .t-blue { color: #5ea8ff; }
    .project-body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
    .project-body h3 { font-size: 16px; font-weight: 600; }
    .project-body p { color: var(--muted); font-size: 13.5px; margin: 6px 0 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .tags span { font-size: 11px; color: #cfc8ff; background: rgba(124,108,255,.12); padding: 3px 9px; border-radius: 20px; }
    .project-links { margin-top: auto; display: flex; justify-content: flex-end; gap: 18px; }
    .project-links a { font-size: 12.5px; color: var(--primary-2); display: inline-flex; align-items: center; gap: 6px; }
    .project-links a:hover { color: #fff; }
    .project-links svg { width: 13px; height: 13px; }
    .dots-nav { display: flex; justify-content: center; gap: 8px; margin-top: 28px; }
    .dots-nav i { width: 7px; height: 7px; border-radius: 50%; background: #34345a; }
    .dots-nav i.on { background: var(--primary-2); }

    /* Mock UI thumbnails (pure CSS) */
    .mock { position: absolute; inset: 0; padding: 38px 18px 0; }
    .mock .win { height: 100%; border-radius: 8px 8px 0 0; padding: 10px; display: grid; gap: 7px; grid-template-columns: 40px 1fr; }
    .mock .side { border-radius: 4px; }
    .mock .main { display: grid; gap: 7px; grid-template-rows: 14px 1fr; }
    .mock .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .mock .blk { border-radius: 4px; }
    .t-purple { background: linear-gradient(140deg, #2a1b5e, #120c2c); }
    .t-purple .win { background: #1a1238; } .t-purple .side, .t-purple .blk { background: #3b2a7a; } .t-purple .hl { background: #b77bff; }
    .t-light { background: linear-gradient(140deg, #eef0ff, #dfe3ff); }
    .t-light .win { background: #fff; } .t-light .side { background: #eef0fb; } .t-light .blk { background: #e3e7f7; } .t-light .hl { background: #4f6bff; }
    .t-dark { background: linear-gradient(140deg, #0c1220, #05070d); }
    .t-dark .win { background: #0f1626; } .t-dark .side, .t-dark .blk { background: #1a2338; } .t-dark .hl { background: #2ee6a6; }
    .t-teal { background: linear-gradient(140deg, #0d3b3e, #071a1c); }
    .t-teal .win { background: #0f2a2c; } .t-teal .side, .t-teal .blk { background: #1b4a4d; } .t-teal .hl { background: #4fe3d1; }
    .t-orange { background: linear-gradient(140deg, #3a1d0b, #1a0d05); }
    .t-orange .win { background: #261408; } .t-orange .side, .t-orange .blk { background: #4a2810; } .t-orange .hl { background: #ff9a3c; }
    .t-blue { background: linear-gradient(140deg, #0e1e48, #070d22); }
    .t-blue .win { background: #0f1a3a; } .t-blue .side, .t-blue .blk { background: #1d2d5c; } .t-blue .hl { background: #5ea8ff; }
    .t-light .num { color: #2b2b55; }
    .mock .chart { position: relative; }
    .mock .chart svg { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); }

    .filters { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 36px; }
    .filters button {
      font: 500 13px "Inter"; color: var(--muted); background: var(--surface); border: 1px solid var(--border);
      padding: 8px 18px; border-radius: 30px; cursor: pointer; transition: all .2s;
    }
    .filters button:hover { color: var(--text); border-color: #3a3a6e; }
    .filters button.on { color: #fff; background: var(--grad); border-color: transparent; }

    /* ========== About page extras ========== */
    .page-hero { padding: 80px 0 60px; text-align: center; position: relative; overflow: hidden; }
    .page-hero::before {
      content: ""; position: absolute; width: 520px; height: 520px; left: 50%; top: -320px; transform: translateX(-50%);
      background: radial-gradient(circle, rgba(108,92,231,.35), transparent 65%);
    }
    .page-hero h1 { font-size: clamp(34px, 4.6vw, 52px); margin: 14px 0 12px; position: relative; }
    .page-hero p { color: var(--muted); max-width: 600px; margin: 0 auto; position: relative; }
    .crumbs { font-size: 13px; color: var(--dim); margin-top: 18px; position: relative; }
    .crumbs a { color: var(--primary-2); }

    .story { display: grid; grid-template-columns: 340px 1fr; gap: 56px; align-items: center; }
    .portrait {
      aspect-ratio: 4/5; border-radius: 18px; position: relative; overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #8b7bff, #4b3cc4 60%, #221a63);
      display: grid; place-items: end center; border: 1px solid #3a3a6e;
    }
    .portrait svg { width: 82%; }
    .portrait .tag {
      position: absolute; left: 16px; bottom: 16px; right: 16px; padding: 12px 14px; border-radius: 10px;
      background: rgba(10,10,28,.8); backdrop-filter: blur(8px); border: 1px solid var(--border); font-size: 13px;
      display: flex; align-items: center; gap: 10px;
    }
    .portrait .tag i { width: 9px; height: 9px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
    .story h2 { font-size: clamp(24px, 2.8vw, 32px); margin: 14px 0; font-weight: 600; line-height: 1.3; }
    .story p { color: var(--muted); margin-bottom: 14px; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin: 22px 0 28px; font-size: 14px; }
    .facts b { color: var(--dim); font-weight: 500; display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }

    .timeline { position: relative; max-width: 780px; margin: 0 auto; }
    .timeline::before { content: ""; position: absolute; left: 11px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--primary), transparent); }
    .tl-item { position: relative; padding: 0 0 30px 48px; }
    .tl-item::before {
      content: ""; position: absolute; left: 4px; top: 6px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--bg); border: 3px solid var(--primary-2); box-shadow: 0 0 0 5px rgba(124,108,255,.15);
    }
    .tl-item .card { padding: 20px 22px; }
    .tl-item small { color: var(--primary-2); font-weight: 600; font-size: 12px; letter-spacing: .05em; }
    .tl-item h3 { font-size: 17px; margin: 4px 0 2px; }
    .tl-item h4 { font-size: 13px; color: var(--dim); font-weight: 500; }
    .tl-item p { color: var(--muted); font-size: 14px; margin-top: 8px; }

    .services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .service { padding: 28px; }
    .service:hover { transform: translateY(-5px); }
    .service .ico { width: 48px; height: 48px; border-radius: 12px; background: var(--grad); display: grid; place-items: center; margin-bottom: 18px; }
    .service .ico svg { width: 22px; height: 22px; color: #fff; }
    .service h3 { font-size: 17px; margin-bottom: 8px; }
    .service p { color: var(--muted); font-size: 14px; }

    /* ========== Contact form (projects page) ========== */
    .contact-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 40px; }
    .contact-info .card { padding: 18px 20px; display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .contact-info .ico { width: 42px; height: 42px; border-radius: 10px; background: rgba(124,108,255,.15); display: grid; place-items: center; color: var(--primary-2); flex: none; }
    .contact-info .ico svg { width: 19px; height: 19px; }
    .contact-info small { display: block; font-size: 12px; color: var(--dim); }
    form.card { padding: 28px; display: grid; gap: 16px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { font-size: 13px; color: var(--muted); display: grid; gap: 7px; }
    input, textarea, select {
      font: 14px "Inter"; color: var(--text); background: var(--bg-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 14px; outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px rgba(124,108,255,.18); }
    textarea { resize: vertical; min-height: 120px; }
    .form-msg { font-size: 13px; color: #2ecc71; min-height: 18px; }

    /* ========== CTA strip + footer (all pages) ========== */
    .cta { padding: 64px 0; border-top: 1px solid #14142c; }
    .cta-grid { display: grid; grid-template-columns: 1fr 1.15fr .8fr; gap: 40px; align-items: center; }
    .cta h2 { font-size: 26px; margin: 8px 0 8px; font-weight: 600; }
    .cta p { color: var(--muted); font-size: 13.5px; margin-bottom: 20px; }
    .quote { padding: 26px; display: grid; grid-template-columns: 40px 1fr; gap: 6px 16px; }
    .quote .q { font-size: 54px; line-height: .8; font-weight: 800; color: var(--primary-2); font-family: Georgia, serif; }
    .quote p { color: #d4d4ec; font-size: 13.5px; margin: 0; }
    .quote .who { grid-column: 2; display: flex; align-items: center; gap: 12px; margin-top: 14px; }
    .quote .av { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg,#f6c9b3,#d68f74); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #4a2416; }
    .quote b { font-size: 13.5px; display: block; }
    .quote small { color: var(--dim); font-size: 12px; }
    .follow .socials { display: flex; gap: 14px; margin: 14px 0 22px; }
    .socials a {
      width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center;
      background: var(--surface); border: 1px solid var(--border); transition: all .2s;
    }
    .socials a:hover { background: var(--grad); border-color: transparent; transform: translateY(-3px); }
    .socials svg { width: 17px; height: 17px; }
    .follow .line { display: flex; align-items: center; gap: 12px; font-size: 13.5px; color: #d4d4ec; margin-bottom: 12px; }
    .follow .line svg { width: 17px; height: 17px; color: var(--primary-2); }
    footer { border-top: 1px solid #14142c; padding: 22px 0; font-size: 12.5px; color: var(--dim); }
    footer .container { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    footer .heart { color: #ff4d6d; }

    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s, transform .7s; }
    .reveal.in { opacity: 1; transform: none; }
    .error-box { max-width: 620px; margin: 120px auto; padding: 32px; text-align: center; }
    .error-box code { background: var(--bg-2); padding: 2px 8px; border-radius: 4px; font-family: var(--mono); }

    /* ========== Responsive ========== */
    @media (max-width: 980px) {
      .hero-grid, .about-grid, .story, .contact-grid, .cta-grid { grid-template-columns: 1fr; }
      .hero-visual { height: 420px; max-width: 480px; margin: 20px auto 0; width: 100%; }
      .skills, .projects, .services { grid-template-columns: 1fr 1fr; }
      .story .portrait { max-width: 340px; }
    }
    @media (max-width: 760px) {
      .nav-links {
        position: absolute; top: 72px; left: 0; right: 0; flex-direction: column; gap: 0;
        background: var(--bg-2); border-bottom: 1px solid var(--border); display: none;
      }
      .nav-links.open { display: flex; }
      .nav-links a { display: block; padding: 14px 4%; }
      .nav-links a.active::after { display: none; }
      .menu-btn { display: block; }
      .nav .btn { display: none; }
      .skills, .projects, .services, .field-row, .facts { grid-template-columns: 1fr; }
      .orb { width: 300px; height: 300px; right: 50%; transform: translateX(50%); }

    /* Stylised developer illustration (no stock photo needed) */
    const DEV_SVG = `

        <rect x="60" y="292" width="150" height="38" rx="6" fill="#1b1b26"/>

      </svg>`;

    /* ===================================================
       Helpers
       =================================================== */
    const $ = (s, el = document) => el.querySelector(s);
    const esc = (s = "") => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const pad = n => String(n).padStart(2, "0");

    function mockThumb(theme, kind) {
      // Small CSS "screenshot" so every project has a unique preview
      const chart = `<div class="blk chart"><svg viewBox="0 0 100 40" preserveAspectRatio="none"><polyline class="hl-line" points="0,32 12,26 24,29 36,18 48,22 60,10 72,15 84,6 100,12" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>`;
      const center = (kind === "Dashboard" || kind === "Data")
        ? `<div class="row" style="grid-template-columns:2fr 1fr">${chart}<div class="blk"></div></div>`
        : (kind === "Fullstack" || kind === "Web")
          ? `<div class="row" style="grid-template-columns:1.2fr 1fr"><div class="blk" style="display:grid;align-content:center;gap:6px;padding:8px"><div class="hl" style="height:8px;width:70%;border-radius:3px"></div><div class="blk" style="height:5px;width:90%;filter:brightness(1.4)"></div><div class="hl" style="height:10px;width:40%;border-radius:3px;margin-top:6px"></div></div><div class="hl" style="border-radius:6px;opacity:.75"></div></div>`
          : `<div class="row"><div class="blk"></div><div class="blk"></div><div class="blk"></div></div>`;
      return `<div class="mock"><div class="win">
        <div class="side"></div>
        <div class="main"><div class="row" style="grid-template-columns:1fr 3fr"><div class="hl" style="border-radius:3px"></div><div></div></div>${center}</div>
      </div></div>`;
    }

    function projectCard(p, i) {

            <h3>${esc(p.title)}</h3>

    const statsHTML = stats => `<div class="stats reveal">${stats.map(s => `

<pre><span class="k">const</span> developer = {

          <div class="card quote">
            <div class="q">“</div>
            <p>${esc(t.quote)}</p>

    /* ===================================================

       =================================================== */
    const PAGES = { home: renderHome, about: renderAbout, projects: renderProjects };

    function route() {
      const hash = location.hash.replace("#", "");
      if (hash === "contact") { $("#contact").scrollIntoView(); return; }
      const page = PAGES[hash] ? hash : "home";
      $("#app").innerHTML = `<div class="page active">${PAGES[page](DATA)}</div>`;
      document.querySelectorAll(".nav-links a").forEach(a => a.classList.toggle("active", a.dataset.page === page));
      $("#navLinks").classList.remove("open");
      window.scrollTo({ top: 0 });
      afterRender();
    }

    function afterRender() {
      // Reveal on scroll + animate skill bars
      const io = new IntersectionObserver(entries => entries.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.classList.add("in");
        e.target.querySelectorAll(".track span").forEach(b => b.style.width = b.dataset.w + "%");
        io.unobserve(e.target);
      }), { threshold: 0.15 });
      document.querySelectorAll(".reveal").forEach(el => io.observe(el));

      // Project filter
      const filters = $("#filters");
      if (filters) filters.addEventListener("click", e => {
        const btn = e.target.closest("button"); if (!btn) return;
        filters.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
        document.querySelectorAll("#projectGrid .project").forEach(card => {
          card.style.display = btn.dataset.cat === "All" || card.dataset.cat === btn.dataset.cat ? "" : "none";
        });
      });

      // Contact form (front-end validation only)
      const form = $("#contactForm");
      if (form) form.addEventListener("submit", e => {
        e.preventDefault();
        const msg = $("#formMsg");
        const f = Object.fromEntries(new FormData(form));
        if (!f.name.trim() || !/^\S+@\S+\.\S+$/.test(f.email) || !f.message.trim()) {
          msg.style.color = "#ff6b81"; msg.textContent = "Please fill in your name, a valid email and a message.";
          return;
        }
        msg.style.color = "#2ecc71"; msg.textContent = `Thanks ${f.name}! Your message has been sent.`;
        form.reset();
      });
    }

    // "Contact" / "Hire Me" links scroll to the shared contact strip without changing page
    document.addEventListener("click", e => {
      const a = e.target.closest("[data-scroll]");
      if (!a) return;
      e.preventDefault();
      $("#" + a.dataset.scroll).scrollIntoView({ behavior: "smooth" });
      $("#navLinks").classList.remove("open");
    });
    $("#menuBtn").addEventListener("click", () => $("#navLinks").classList.toggle("open"));
    window.addEventListener("hashchange", route);

    /* ===================================================
       Boot: load data.json
       =================================================== */
    fetch("data.json")
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => { DATA = d; renderShared(d); route(); })
      .catch(err => {
        $("#app").innerHTML = `<div class="card error-box">
          <h2 style="margin-bottom:10px">Couldn't load <code>data.json</code></h2>
          <p style="color:var(--muted)">Browsers block <code>fetch()</code> when a page is opened directly as a file.
          Run it through a local server instead — e.g. VS Code <b>Live Server</b>, or <code>python3 -m http.server</code> in this folder, then open <code>http://localhost:8000</code>.</p>
          <p style="color:var(--dim);font-size:13px;margin-top:10px">(${esc(err.message)})</p></div>`;
      });
  </script>
</body>
</html>
